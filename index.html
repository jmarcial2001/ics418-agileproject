<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Ka Lama Kiosk</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="splash-active">
    <header>
        <div class="brand" aria-label="University of Hawaiʻi Maui College">
            <img class="brand-mark" src="img/uhmc-logo.png" alt="">
            <span class="brand-copy">
                <strong>UHMC</strong>
                <span id="building-name">Ka Lama Building</span>
            </span>
        </div>
        <div class="topbar-right">
            <span class="open-label"><span class="status-dot"></span> CAMPUS KIOSK</span>
            <time id="clock" aria-label="Current time in Hawaiʻi"></time>
        </div>
    </header>
    <main id="view"></main>

    <section class="splash-screen" id="splash" role="dialog" aria-modal="true" aria-label="UHMC welcome">
        <div class="splash-content">
            <div class="splash-brand" aria-label="University of Hawaiʻi Maui College">
                <span class="splash-brand-mark"><img src="img/uhmc-logo.png" alt=""></span>
                <span class="splash-brand-copy"><strong>UH Maui College</strong><span>Ka Lama Building</span></span>
                <time class="splash-clock" id="splash-clock" aria-label="Current time"></time>
            </div>
            <div class="splash-main">
                <div class="splash-copy">
                    <p class="splash-kicker">E KOMO MAI <span aria-hidden="true">·</span> WELCOME</p>
                    <h1>Your next stop<br>starts here.</h1>
                    <p class="splash-intro">Find a room. Explore programs. Connect.</p>
                </div>
                <div class="splash-illustration" aria-hidden="true">
                    <svg class="splash-student" viewBox="0 0 768 1205" aria-hidden="true" focusable="false">
                        <defs>
                            <mask id="splash-student-arm-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="768" height="1205">
                                <rect width="768" height="1205" fill="#fff"></rect>
                                <path d="M510 100 H680 V300 H644 C641 319 639 339 638 359 C637 379 633 398 622 413 C614 425 604 429 594 424 C581 419 570 412 560 403 C553 395 553 386 557 375 C562 360 560 345 552 328 C543 311 529 297 510 292 Z" fill="#000"></path>
                            </mask>
                        </defs>
                        <image href="img/waving-college-student.png" width="768" height="1205" mask="url(#splash-student-arm-clearance)"></image>
                        <image class="splash-student-forearm" href="img/waving-forearm.png" x="520" y="105" width="148" height="328"></image>
                    </svg>
                </div>
            </div>
            <div class="splash-actions">
                <button class="splash-enter" type="button" id="splash-enter" aria-label="Tap to interact">
                    <span class="splash-tap-icon-wrap" aria-hidden="true">
                        <img class="splash-tap-icon" src="img/fingertip-tap-ripple.png" alt="">
                    </span>
                    <span class="splash-enter-label">Tap to interact</span>
                </button>
                <span class="splash-caption">KA LAMA <span aria-hidden="true">•</span> UH MAUI COLLEGE</span>
            </div>
        </div>
    </section>

    <section class="idle-warning" id="idle-warning" role="dialog" aria-modal="true" aria-labelledby="idle-warning-title" aria-hidden="true" hidden>
        <div class="idle-warning-card">
            <span class="idle-warning-kicker">Campus kiosk</span>
            <h2 id="idle-warning-title">Are you still there?</h2>
            <p>For your privacy, this kiosk will return to the welcome screen in <strong id="idle-countdown">15</strong> seconds.</p>
            <button class="idle-stay-button" type="button" id="idle-stay">Yes, keep browsing</button>
        </div>
    </section>

    <!-- QR code lib (kiosk has internet). If offline, the page falls back to showing the link text. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="data/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
