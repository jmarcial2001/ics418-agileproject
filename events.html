
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events - Ka Lama</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      color: #222;
    }

    header {
      background: #123e70;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000015;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button, .back {
      display: inline-block;
      background: #123e70;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover, .back:hover {
      background: #0b2b50;
    }

    .back {
      margin-bottom: 25px;
    }

    .event-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .event-item h3 {
      margin-top: 0;
    }

    .event-item p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .delete-btn {
      background: #b42318;
    }

    .delete-btn:hover {
      background: #8d1c13;
    }

    .cancel-btn {
      background: #666;
      margin-left: 10px;
    }

    .hidden {
      display: none;
    }

    .message {
      color: #146c43;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Manage Events</h1>
    <p>Ka Lama - UH Maui College</p>
  </header>

  <main>

    <a class="back" href="admin.html">
      Back to Dashboard
    </a>

    <h2 id="form-title">Add Event</h2>

    <div class="panel">
      <form id="event-form">

        <label for="title">Event Name</label>
        <input
          id="title"
          type="text"
          placeholder="Example: Business Department Workshop"
          required
        >

        <label for="date">Event Date</label>
        <input id="date" type="date" required>

        <label for="time">Event Time</label>
        <input id="time" type="time" required>

        <label for="location">Event Location</label>
        <input
          id="location"
          type="text"
          placeholder="Example: Ka Lama Room 107"
          required
        >

        <label for="description">Event Description</label>
        <textarea
          id="description"
          placeholder="Enter event details"
          required
        ></textarea>

        <button id="save-btn" type="submit">
          Save Event
        </button>

        <button
          id="cancel-btn"
          class="cancel-btn hidden"
          type="button"
        >
          Cancel
        </button>

        <p id="message" class="message" role="status"></p>

      </form>
    </div>

    <h2>Saved Events</h2>

    <div class="panel">
      <div id="event-list"></div>
    </div>

  </main>

  <script>
    const storageKey = "kaLamaEvents";
    let editingIndex = null;

    const form = document.getElementById("event-form");
    const titleInput = document.getElementById("title");
    const dateInput = document.getElementById("date");
    const timeInput = document.getElementById("time");
    const locationInput =
      document.getElementById("location");
    const descriptionInput =
      document.getElementById("description");
    const message = document.getElementById("message");

    function getEvents() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(storageKey) || "[]"
        );
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveEvents(items) {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(items)
        );
        return true;
      } catch (error) {
        alert("Unable to save events in this browser.");
        return false;
      }
    }

    function resetForm() {
      editingIndex = null;
      form.reset();

      document.getElementById("form-title").textContent =
        "Add Event";
      document.getElementById("save-btn").textContent =
        "Save Event";
      document.getElementById("cancel-btn")
        .classList.add("hidden");
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      const date = dateInput.value;
      const time = timeInput.value;
      const location = locationInput.value.trim();
      const description = descriptionInput.value.trim();

      if (!title || !date || !time || !location || !description) {
        alert("Please complete all fields.");
        return;
      }

      const events = getEvents();

      const newEvent = {
        title: title,
        date: date,
        time: time,
        location: location,
        description: description
      };

      const wasEditing = editingIndex !== null;

      if (wasEditing) {
        events[editingIndex] = newEvent;
      } else {
        events.push(newEvent);
      }

      if (!saveEvents(events)) {
        return;
      }

      resetForm();
      displayEvents();

      message.textContent = wasEditing
        ? "Event updated successfully!"
        : "Event saved successfully!";
    });

    function displayEvents() {
      const events = getEvents();
      const list = document.getElementById("event-list");

      list.replaceChildren();

      if (events.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "No events have been added yet.";
        list.appendChild(empty);
        return;
      }

      events.forEach(function(item, index) {
        const card = document.createElement("div");
        card.className = "event-item";

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const date = document.createElement("p");
        date.textContent = "Date: " + item.date;

        const time = document.createElement("p");
        time.textContent = "Time: " + item.time;

        const location = document.createElement("p");
        location.textContent =
          "Location: " + item.location;

        const description = document.createElement("p");
        description.textContent = item.description;

        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.onclick = function() {
          editEvent(index);
        };

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-btn";
        deleteButton.onclick = function() {
          deleteEvent(index);
        };

        actions.append(editButton, deleteButton);
        card.append(
          heading,
          date,
          time,
          location,
          description,
          actions
        );

        list.appendChild(card);
      });
    }

    function editEvent(index) {
      const item = getEvents()[index];

      if (!item) {
        return;
      }

      editingIndex = index;

      titleInput.value = item.title;
      dateInput.value = item.date;
      timeInput.value = item.time;
      locationInput.value = item.location;
      descriptionInput.value = item.description;

      document.getElementById("form-title").textContent =
        "Edit Event";
      document.getElementById("save-btn").textContent =
        "Update Event";
      document.getElementById("cancel-btn")
        .classList.remove("hidden");

      message.textContent = "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      titleInput.focus();
    }

    function deleteEvent(index) {
      const events = getEvents();
      const item = events[index];

      if (!item) {
        return;
      }

      if (!confirm("Delete event: " + item.title + "?")) {
        return;
      }

      events.splice(index, 1);

      if (!saveEvents(events)) {
        return;
      }

      resetForm();
      displayEvents();

      message.textContent = "Event deleted successfully.";
    }

    document.getElementById("cancel-btn")
      .addEventListener("click", function() {
        resetForm();
        message.textContent = "";
      });

    displayEvents();
  </script>

</body>
</html>
