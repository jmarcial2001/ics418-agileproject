
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Announcements - Ka Lama</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      color: #222;
    }

    header {
      background: #123e70;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000015;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button, .back {
      display: inline-block;
      background: #123e70;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover, .back:hover {
      background: #0b2b50;
    }

    .back {
      margin-bottom: 25px;
    }

    .announcement-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .announcement-item h3 {
      margin-top: 0;
    }

    .announcement-item p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .delete-btn {
      background: #b42318;
    }

    .delete-btn:hover {
      background: #8d1c13;
    }

    .cancel-btn {
      background: #666;
      margin-left: 10px;
    }

    .hidden {
      display: none;
    }

    .message {
      color: #146c43;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Manage Announcements</h1>
    <p>Ka Lama - UH Maui College</p>
  </header>

  <main>

    <a class="back" href="admin.html">
      Back to Dashboard
    </a>

    <h2 id="form-title">Add Announcement</h2>

    <div class="panel">
      <form id="announcement-form">

        <label for="title">Announcement Title</label>
        <input
          id="title"
          type="text"
          placeholder="Example: Business Club Meeting"
          required
        >

        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Enter announcement details"
          required
        ></textarea>

        <label for="date">Announcement Date</label>
        <input id="date" type="date" required>

        <button id="save-btn" type="submit">
          Save Announcement
        </button>

        <button
          id="cancel-btn"
          class="cancel-btn hidden"
          type="button"
        >
          Cancel
        </button>

        <p id="message" class="message" role="status"></p>

      </form>
    </div>

    <h2>Saved Announcements</h2>

    <div class="panel">
      <div id="announcement-list"></div>
    </div>

  </main>

  <script>
    const storageKey = "kaLamaAnnouncements";
    let editingIndex = null;

    const form = document.getElementById("announcement-form");
    const titleInput = document.getElementById("title");
    const descriptionInput =
      document.getElementById("description");
    const dateInput = document.getElementById("date");
    const message = document.getElementById("message");

    function getAnnouncements() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(storageKey) || "[]"
        );
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        return [];
      }
    }

    function saveAnnouncements(items) {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(items)
        );
        return true;
      } catch (error) {
        alert("Unable to save announcements in this browser.");
        return false;
      }
    }

    function resetForm() {
      editingIndex = null;
      form.reset();

      document.getElementById("form-title").textContent =
        "Add Announcement";
      document.getElementById("save-btn").textContent =
        "Save Announcement";
      document.getElementById("cancel-btn")
        .classList.add("hidden");
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      const description = descriptionInput.value.trim();
      const date = dateInput.value;

      if (!title || !description || !date) {
        alert("Please complete all fields.");
        return;
      }

      const announcements = getAnnouncements();

      const announcement = {
        title: title,
        description: description,
        date: date
      };

      const wasEditing = editingIndex !== null;

      if (wasEditing) {
        announcements[editingIndex] = announcement;
      } else {
        announcements.push(announcement);
      }

      if (!saveAnnouncements(announcements)) {
        return;
      }

      resetForm();
      displayAnnouncements();

      message.textContent = wasEditing
        ? "Announcement updated successfully!"
        : "Announcement saved successfully!";
    });

    function displayAnnouncements() {
      const announcements = getAnnouncements();
      const list =
        document.getElementById("announcement-list");

      list.replaceChildren();

      if (announcements.length === 0) {
        const empty = document.createElement("p");
        empty.textContent =
          "No announcements have been added yet.";
        list.appendChild(empty);
        return;
      }

      announcements.forEach(function(item, index) {
        const card = document.createElement("div");
        card.className = "announcement-item";

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const date = document.createElement("p");
        date.textContent = "Date: " + item.date;

        const description = document.createElement("p");
        description.textContent = item.description;

        const actions = document.createElement("div");
        actions.className = "actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.onclick = function() {
          editAnnouncement(index);
        };

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-btn";
        deleteButton.onclick = function() {
          deleteAnnouncement(index);
        };

        actions.append(editButton, deleteButton);
        card.append(heading, date, description, actions);
        list.appendChild(card);
      });
    }

    function editAnnouncement(index) {
      const item = getAnnouncements()[index];

      if (!item) {
        return;
      }

      editingIndex = index;
      titleInput.value = item.title;
      descriptionInput.value = item.description;
      dateInput.value = item.date;

      document.getElementById("form-title").textContent =
        "Edit Announcement";
      document.getElementById("save-btn").textContent =
        "Update Announcement";
      document.getElementById("cancel-btn")
        .classList.remove("hidden");

      message.textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
      titleInput.focus();
    }

    function deleteAnnouncement(index) {
      const announcements = getAnnouncements();
      const item = announcements[index];

      if (!item) {
        return;
      }

      if (!confirm(
        "Delete announcement: " + item.title + "?"
      )) {
        return;
      }

      announcements.splice(index, 1);

      if (!saveAnnouncements(announcements)) {
        return;
      }

      resetForm();
      displayAnnouncements();
      message.textContent = "Announcement deleted successfully.";
    }

    document.getElementById("cancel-btn")
      .addEventListener("click", function() {
        resetForm();
        message.textContent = "";
      });

    displayAnnouncements();
  </script>

</body>
</html>
